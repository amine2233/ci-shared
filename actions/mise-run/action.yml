name: "Mise Run"
description: "Install mise (provisioning the tools + tasks from the project's mise.toml) and run one or more mise tasks."

inputs:
  tasks:
    description: "Argument string passed to `mise run`, e.g. 'test' or 'build_documentations macOS --hosting-base-path foo'. Separate multiple tasks with ' ::: '."
    required: true
  install-tools:
    description: "Install tools declared in mise.toml before running ('true'/'false')."
    required: false
    default: "true"
  mise-version:
    description: "Pin a mise version (empty = latest)."
    required: false
    default: ""
  cache:
    description: "Cache mise-installed tools ('true'/'false')."
    required: false
    default: "true"
  experimental:
    description: "Enable mise experimental features ('true'/'false')."
    required: false
    default: "false"
  working-directory:
    description: "Directory containing mise.toml / where tasks run."
    required: false
    default: "."
  env:
    description: "Optional KEY=VALUE lines (one per line) exported before running the task(s)."
    required: false
    default: ""
  linux-swift-deps:
    description: "On Linux, apt-install the system libraries the swift.org toolchain needs (libcurl, libxml2, libstdc++/libgcc dev, ...) ('true'/'false')."
    required: false
    default: "true"
  linux-extra-packages:
    description: "Extra apt packages (space-separated) to install on Linux, e.g. 'libsqlite3-dev libssl-dev'."
    required: false
    default: ""
  linux-libxml2-compat:
    description: "On Linux, install libxml2.so.2 (needed by executor's Linux binary) from Ubuntu 24.04 when the runner lacks it, e.g. on Ubuntu 26.04 which only ships libxml2.so.16 ('true'/'false')."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install Swift Linux dependencies
      if: ${{ runner.os == 'Linux' && (inputs.linux-swift-deps == 'true' || inputs.linux-extra-packages != '') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SWIFT_DEPS: ${{ inputs.linux-swift-deps }}
        EXTRA_PACKAGES: ${{ inputs.linux-extra-packages }}
      run: |
        set -euo pipefail
        . /etc/os-release
        echo "Linux: ${PRETTY_NAME:-$ID $VERSION_ID}"

        pkgs=()
        if [ "${SWIFT_DEPS}" = "true" ]; then
          # Mirrors swiftlang/swift-docker (<swift>/ubuntu/<version>/Dockerfile).
          case "${VERSION_ID:-}" in
            26.04) gcc=15 ;;
            24.04) gcc=13 ;;
            22.04) gcc=12 ;;
            *)     gcc="$(gcc -dumpversion 2>/dev/null | cut -d. -f1 || true)" ;;
          esac
          pkgs+=(binutils git unzip gnupg2 libc6-dev libcurl4-openssl-dev libedit2
                 libpython3-dev libsqlite3-0 libxml2-dev libncurses-dev libz3-dev
                 pkg-config tzdata zlib1g-dev)
          [ -n "${gcc}" ] && pkgs+=("libgcc-${gcc}-dev" "libstdc++-${gcc}-dev")
          # gold was split out of binutils on newer releases; swift still links with it.
          apt-cache show binutils-gold >/dev/null 2>&1 && pkgs+=(binutils-gold)

          # Swift < 6.4 has no swift.org toolchain for Ubuntu 26.04: fail early with a clear hint.
          if [ "${VERSION_ID:-}" = "26.04" ] && [ -f mise.toml ]; then
            want="$(sed -nE 's/^[[:space:]]*"?swift"?[[:space:]]*=[[:space:]]*"([0-9][0-9.]*)".*/\1/p' mise.toml | head -n1)"
            if [ -n "${want}" ] && [ "$(printf '%s\n' 6.4 "${want}" | sort -V | head -n1)" != "6.4" ]; then
              echo "::error file=mise.toml::swift ${want} has no Ubuntu 26.04 toolchain on swift.org. Bump to swift >= 6.4 in mise.toml, or set linux-runner: ubuntu-24.04."
              exit 1
            fi
          fi
        fi
        # shellcheck disable=SC2206
        [ -n "${EXTRA_PACKAGES}" ] && pkgs+=(${EXTRA_PACKAGES})

        missing=()
        for p in "${pkgs[@]}"; do
          dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || missing+=("$p")
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "All Linux dependencies already installed."
          exit 0
        fi
        echo "::group::apt-get install ${missing[*]}"
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get -q update
        sudo apt-get -q install -y --no-install-recommends "${missing[@]}"
        echo "::endgroup::"

    - name: Install libxml2.so.2 compatibility library
      if: ${{ runner.os == 'Linux' && inputs.linux-libxml2-compat == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if /sbin/ldconfig -p | grep -q 'libxml2\.so\.2 '; then
          echo "libxml2.so.2 already available."
          exit 0
        fi
        # Ubuntu >= 25.10 ships only libxml2.so.16 (libxml2-16), an incompatible ABI,
        # so executor fails with "libxml2.so.2: cannot open shared object file".
        # Install noble's libxml2 (+ its libicu74 dependency) side by side; the
        # pin keeps every other noble package out.
        case "$(dpkg --print-architecture)" in
          amd64|i386) mirror=http://archive.ubuntu.com/ubuntu; security=http://security.ubuntu.com/ubuntu ;;
          *)          mirror=http://ports.ubuntu.com/ubuntu-ports; security="${mirror}" ;;
        esac
        sudo tee /etc/apt/sources.list.d/ci-shared-noble-libxml2.sources >/dev/null <<SRC
        Types: deb
        URIs: ${mirror}
        Suites: noble noble-updates
        Components: main
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: ${security}
        Suites: noble-security
        Components: main
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        SRC
        sudo tee /etc/apt/preferences.d/ci-shared-noble-libxml2 >/dev/null <<'PIN'
        Package: *
        Pin: release n=noble
        Pin-Priority: -1

        Package: libxml2 libicu74
        Pin: release n=noble
        Pin-Priority: 500
        PIN
        echo "::group::apt-get install libxml2 (noble)"
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get -q update
        sudo apt-get -q install -y --no-install-recommends libxml2 libicu74
        echo "::endgroup::"
        /sbin/ldconfig -p | grep 'libxml2\.so\.2 '

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        version: ${{ inputs.mise-version }}
        install: ${{ inputs.install-tools }}
        cache: ${{ inputs.cache }}
        experimental: ${{ inputs.experimental }}
        working_directory: ${{ inputs.working-directory }}

    - name: Run mise task(s)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MISE_TASKS: ${{ inputs.tasks }}
        EXTRA_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail
        if [ -n "${EXTRA_ENV}" ]; then
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            export "${line?}"
          done <<< "${EXTRA_ENV}"
        fi
        echo "::group::mise run ${MISE_TASKS}"
        mise run ${MISE_TASKS}
        echo "::endgroup::"
