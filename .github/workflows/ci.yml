name: CI

# Reusable CI workflow for Swift packages.
# The build/test/lint logic lives in the project's mise.toml — this workflow
# only sets up runners and calls `mise run <task>` via the mise-run action.
#
# Usage (from a consumer repo):
#
#   jobs:
#     ci:
#       uses: amine2233/ci-shared/.github/workflows/ci.yml@main

on:
  workflow_call:
    inputs:
      macos-runner:
        description: "GitHub-hosted macOS runner image."
        type: string
        default: "macos-latest"
      linux-runner:
        description: "GitHub-hosted Linux runner image."
        type: string
        default: "ubuntu-latest"
      enable-macos:
        description: "Run tests on macOS."
        type: boolean
        default: true
      enable-linux:
        description: "Run tests on Linux."
        type: boolean
        default: true
      enable-lint:
        description: "Run the lint job (pull requests only)."
        type: boolean
        default: true
      enable-coverage:
        description: "Use the coverage task on macOS instead of the plain test task."
        type: boolean
        default: false
      test-task:
        description: "mise task that runs the tests."
        type: string
        default: "test"
      coverage-task:
        description: "mise task that runs tests with coverage (macOS)."
        type: string
        default: "test-coverage"
      lint-task:
        description: "mise task(s) for the lint job (use ' ::: ' to chain several)."
        type: string
        default: "lint"
      enable-title-check:
        description: "Run the merge/pull request title check (pull requests only)."
        type: boolean
        default: false
      title-check-task:
        description: "mise task that checks the pull request title."
        type: string
        default: "check_merge_request_title"
      comment-target:
        description: "Target the title-check comment is posted on (default: the pull request number)."
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ inputs.enable-lint && github.event_name == 'pull_request' }}
    name: Lint
    runs-on: ${{ inputs.macos-runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: amine2233/ci-shared/actions/mise-run@main
        with:
          tasks: ${{ inputs.lint-task }}

  title-check:
    if: ${{ inputs.enable-title-check && github.event_name == 'pull_request' }}
    name: Merge request title
    runs-on: ${{ inputs.linux-runner }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: amine2233/ci-shared/actions/mise-run@main
        with:
          tasks: ${{ inputs.title-check-task }}
          env: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            COMMENT_TARGET=${{ inputs.comment-target || github.event.pull_request.number }}

  macos:
    if: ${{ inputs.enable-macos }}
    name: Test (macOS)
    runs-on: ${{ inputs.macos-runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: amine2233/ci-shared/actions/mise-run@main
        with:
          tasks: ${{ inputs.enable-coverage && inputs.coverage-task || inputs.test-task }}

  linux:
    if: ${{ inputs.enable-linux }}
    name: Test (Linux)
    runs-on: ${{ inputs.linux-runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: amine2233/ci-shared/actions/mise-run@main
        with:
          tasks: ${{ inputs.test-task }}
